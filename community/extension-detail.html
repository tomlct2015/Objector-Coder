<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>扩展详情 - Objector 社区</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="shared/community.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="shared/community-api.js"></script>
  <script src="shared/community-ui.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="page-container">
    <div id="ext-detail">
      <div class="loading">加载中...</div>
    </div>

    <!-- 评论区 -->
    <section class="comments-section" id="comments-section" style="display:none; margin-top:32px;">
      <h3>💬 评论</h3>
      <div id="comment-form-wrap"></div>
      <div id="comments-list" class="comment-list"></div>
    </section>
  </div>

  <footer class="footer">
    <p>Objector Community · Powered by Supabase</p>
  </footer>

  <script>
    CommunityAPI.init();
    CommunityUI.renderNav('nav');
    CommunityAPI.restoreSession().then(() => CommunityUI.renderNav('nav'));

    const extId = new URLSearchParams(location.search).get('id');

    async function loadExtension() {
      if (!extId) {
        document.getElementById('ext-detail').innerHTML = '<div class="empty-state"><p>扩展不存在</p><a href="extensions.html" class="btn">返回扩展市场</a></div>';
        return;
      }

      const res = await CommunityAPI.getExtensionById(extId);
      if (res.error || !res.data) {
        document.getElementById('ext-detail').innerHTML = '<div class="empty-state"><p>扩展不存在或已被删除</p><a href="extensions.html" class="btn">返回扩展市场</a></div>';
        return;
      }

      renderExtension(res.data);
    }

    function renderExtension(ext) {
      const user = CommunityAPI.getUser();
      const isAuthor = user && ext.author_id === user.id;
      const authorName = ext.profiles ? ext.profiles.username : '匿名';
      const authorAvatar = ext.profiles ? ext.profiles.avatar_url : null;

      document.getElementById('ext-detail').innerHTML = `
        <div class="detail-main detail-ext">
          <div class="detail-info">
            <div class="ext-icon-large">🧩</div>
            <h1>${ext.name}</h1>
            <div class="detail-meta">
              <a href="profile.html?id=${ext.author_id}" class="user-link">
                ${authorAvatar ? `<img src="${authorAvatar}" class="avatar-sm" />` : ''}
                ${authorName}
              </a>
              <span>·</span>
              <span>v${ext.version || '1.0.0'}</span>
              <span>·</span>
              <span>${new Date(ext.created_at).toLocaleDateString()}</span>
            </div>
            <div class="ext-meta-row">
              <span class="meta-item">🧱 ${ext.block_count || 0} 个积木</span>
              <span class="meta-item">⬇️ ${ext.downloads_count || 0} 次下载</span>
              <span class="meta-item">❤️ ${ext.likes_count || 0} 个点赞</span>
            </div>
            ${ext.description ? `<div class="detail-desc markdown-body">${marked.parse(ext.description)}</div>` : ''}
            <div class="detail-actions">
              ${user ? `<button class="btn btn-outline" id="btn-like">${ext.user_liked ? '❤️ 已点赞' : '🤍 点赞'}</button>` : ''}
              ${ext.file_url ? `<button class="btn btn-primary" id="btn-download">⬇️ 下载扩展</button>` : `<span class="btn btn-outline" style="opacity:0.5;cursor:not-allowed;">❗ 无可下载文件</span>`}
              ${isAuthor ? `<button class="btn btn-danger btn-sm" id="btn-delete">删除</button>` : ''}
            </div>
          </div>
        </div>
      `;

      const btnLike = document.getElementById('btn-like');
      if (btnLike) {
        btnLike.addEventListener('click', async () => {
          const liked = btnLike.textContent.includes('已点赞');
          const result = liked
            ? await CommunityAPI.unlikeTarget('extension', extId)
            : await CommunityAPI.likeTarget('extension', extId);
          if (!result.error) location.reload();
        });
      }

      // 下载按钮：通过 fetch + blob 实现跨域下载
      const btnDownload = document.getElementById('btn-download');
      if (btnDownload && ext.file_url) {
        btnDownload.addEventListener('click', async () => {
          btnDownload.disabled = true;
          btnDownload.textContent = '下载中...';
          try {
            const resp = await fetch(ext.file_url);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const respBlob = await resp.blob();
            // 根据响应头 content-type 确定 MIME 类型，区分 js 和 json
            const serverType = resp.headers.get('content-type') || '';
            let mimeType = respBlob.type || serverType;
            let fileName;
            // 从 URL 提取文件名
            const urlParts = ext.file_url.split('/');
            const rawName = urlParts[urlParts.length - 1] || '';
            // URL 无明确后缀时，通过内容判断
            const text = await respBlob.text();
            try {
              JSON.parse(text);
              mimeType = 'application/json';
              fileName = ext.name + '.json';
            } catch (_) {
              mimeType = 'application/javascript';
              fileName = ext.name + '.js';
            }
            const blob = new Blob([text], { type: mimeType });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
            URL.revokeObjectURL(a.href);
            CommunityUI.showToast('下载完成 (' + fileName + ')', 'success');
            btnDownload.disabled = false;
            btnDownload.textContent = '⬇️ 下载扩展';
            return;
          } catch (e) {
            window.open(ext.file_url, '_blank');
          }
          btnDownload.disabled = false;
          btnDownload.textContent = '⬇️ 下载扩展';
        });
      }

      // 安装按钮
      const btnInstall = document.getElementById('btn-install');
      if (btnInstall) {
        btnInstall.addEventListener('click', async () => {
          if (!ext.file_url) {
            CommunityUI.showToast('此扩展没有可下载文件', 'error');
            return;
          }
          try {
            CommunityUI.showToast('正在下载并安装...', 'info');
            const response = await fetch(ext.file_url);
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const text = await response.text();
            const key = 'extension:' + (ext.ext_id || ext.name);
            // 尝试 JSON 解析，失败则作为纯 JS 存储
            let stored;
            try {
              const jsonData = JSON.parse(text);
              stored = JSON.stringify(jsonData);
            } catch (jsonErr) {
              // 非 JSON（如 .js 文件），直接存储原始文本
              stored = text;
            }
            localStorage.setItem(key, stored);
            CommunityUI.showToast('安装成功！请在编辑器中查看', 'success');
          } catch (e) {
            CommunityUI.showToast('安装失败: ' + e.message, 'error');
          }
        });
      }

      const btnDelete = document.getElementById('btn-delete');
      if (btnDelete) {
        btnDelete.addEventListener('click', async () => {
          if (!confirm('确定要删除这个扩展吗？')) return;
          const result = await CommunityAPI.deleteExtension(extId);
          if (result.error) {
            CommunityUI.showToast('删除失败', 'error');
          } else {
            CommunityUI.showToast('已删除', 'success');
            setTimeout(() => location.href = 'extensions.html', 1000);
          }
        });
      }

      // 显示评论区
      document.getElementById('comments-section').style.display = '';
      loadComments();
    }

    async function loadComments() {
      const res = await CommunityAPI.getComments('extension', extId);
      const list = document.getElementById('comments-list');
      const formWrap = document.getElementById('comment-form-wrap');

      // 渲染评论表单
      const user = CommunityAPI.getUser();
      if (user) {
        formWrap.innerHTML = CommunityUI.renderCommentForm('extension', extId, loadComments);
        CommunityUI.bindCommentForm('extension', extId, '#comment-form-wrap', loadComments);
      } else {
        formWrap.innerHTML = '<div class="comment-form-locked"><a href="login.html">登录</a>后才能评论</div>';
      }

      // 渲染评论列表
      if (res.data && res.data.length > 0) {
        list.innerHTML = CommunityUI.renderCommentList(res.data);
      } else {
        list.innerHTML = '<div class="empty-hint">暂无评论</div>';
      }
    }

    loadExtension();
  </script>
</body>
</html>
