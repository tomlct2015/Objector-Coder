<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Objector Web IDE</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="web-styles.css" />
  <script src="core/i18n.js"></script>
  <script src="i18n/zh-CN.js"></script>
  <script src="i18n/en.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../community/shared/community-api.js"></script>
  <script src="web-api-shim.js"></script>
</head>
<body>
  <!-- 顶部导航栏 -->
  <header id="titlebar">
    <div class="titlebar-drag">
      <span class="app-title" style="font-size:14px;">⚡ Objector Web IDE</span>
    </div>
    <div style="display:flex;gap:8px;padding-right:12px;">
      <a href="../community/index.html" class="tb-btn" style="text-decoration:none;font-size:11px;">🏘️ 社区</a>
      <a href="../blocks-guide/" target="_blank" class="tb-btn" style="text-decoration:none;font-size:11px;" data-i18n="editor.blocksGuide">📖 积木指南</a>
      <button id="home-lang-switch" class="tb-btn" data-i18n="langSwitch" title="Switch Language" style="font-size:11px;">EN</button>
    </div>
  </header>

  <!-- 主页 -->
  <div id="home-screen">
    <header class="home-header">
      <h1 class="home-logo" style="font-size:20px;">⚡ Objector Web IDE</h1>
      <div class="home-actions">
        <button id="home-btn-new" class="tb-btn tb-run" data-i18n="home.newProject">+ 新建工程</button>
        <button id="home-btn-open" class="tb-btn" data-i18n="home.openProject">打开项目</button>
      </div>
    </header>
    <main class="home-body">
      <h2 data-i18n="home.pinned">📌 固定项目</h2>
      <div id="pinned-projects"></div>
      <div id="no-pinned" class="hidden">
        <p style="color:var(--text-muted);font-size:13px;" data-i18n="home.pinnedHint">点击项目卡片上的 📌 按钮固定项目到这里</p>
      </div>
      <h2 style="margin-top:24px;" data-i18n="home.recent">最近项目</h2>
      <div id="recent-projects"></div>
      <div id="no-projects" class="hidden">
        <p data-i18n="home.noProjects">还没有项目，点击上方按钮开始创作</p>
      </div>
    </main>
  </div>

  <!-- 模式选择弹窗 -->
  <div id="mode-dialog" class="dialog-overlay hidden">
    <div class="dialog-box mode-dialog-box">
      <h2 data-i18n="mode.title">选择创作模式</h2>
      <p data-i18n="mode.desc">选择你想要的创作方式</p>
      <div class="mode-cards">
        <div class="mode-card" data-mode="normal">
          <div class="mode-icon">🎮</div>
          <h3 data-i18n="mode.normal">普通创作</h3>
          <p data-i18n="mode.normalDesc">使用积木搭建动画、游戏，专注于创意本身</p>
        </div>
        <div class="mode-card" data-mode="extension">
          <div class="mode-icon">🧩</div>
          <h3 data-i18n="mode.extension">扩展创作</h3>
          <p data-i18n="mode.extensionDesc">创建自定义扩展积木，为 Objector 增加新功能</p>
        </div>
      </div>
      <button id="mode-cancel" class="tb-btn" data-i18n="mode.cancel">取消</button>
    </div>
  </div>

  <!-- 打开项目来源选择弹窗 -->
  <div id="open-source-dialog" class="dialog-overlay hidden">
    <div class="dialog-box open-source-box">
      <h2 id="os-title" data-i18n="home.openProject">打开项目</h2>
      <div id="os-tabs" class="os-tabs">
        <button class="os-tab active" data-source="cloud">☁️ 云端</button>
        <button class="os-tab" data-source="local">📁 本地文件</button>
        <button class="os-tab" data-source="url">🔗 网址</button>
      </div>
      <!-- 云端项目列表 -->
      <div id="os-cloud-panel" class="os-panel">
        <div id="os-cloud-status" style="color:var(--text-muted);font-size:12px;margin-bottom:8px;"></div>
        <div id="os-cloud-list" class="os-cloud-list"></div>
      </div>
      <!-- 本地文件 -->
      <div id="os-local-panel" class="os-panel" style="display:none">
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:12px;">选择本地项目（ZIP 文件或文件夹）</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <div style="flex:1;min-width:180px;">
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">📦 ZIP 文件</label>
            <input type="file" id="os-local-file" accept=".zip" style="margin-bottom:8px;" />
            <button id="os-local-btn" class="tb-btn tb-run" style="width:100%;">打开 ZIP</button>
          </div>
          <div style="flex:1;min-width:180px;">
            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:4px;">📁 文件夹</label>
            <input type="file" id="os-local-folder" webkitdirectory multiple style="margin-bottom:8px;" />
            <button id="os-local-folder-btn" class="tb-btn tb-run" style="width:100%;">打开文件夹</button>
          </div>
        </div>
      </div>
      <!-- 网址 -->
      <div id="os-url-panel" class="os-panel" style="display:none">
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:12px;">输入 ZIP 格式项目的网址</p>
        <input type="url" id="os-url-input" placeholder="https://example.com/project.zip" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);color:var(--text);margin-bottom:12px;" />
        <button id="os-url-btn" class="tb-btn tb-run">下载并打开</button>
      </div>
      <div style="margin-top:16px;">
        <button id="os-cancel" class="tb-btn" data-i18n="dialog.cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 项目选择器（编辑器中调用 selectFolder 时显示） -->
  <div id="web-project-picker" class="web-picker-overlay hidden">
    <div class="web-picker-box">
      <h2 id="picker-title">选择项目</h2>
      <div class="picker-list" id="picker-project-list"></div>
      <div class="picker-actions">
        <button class="tb-btn" onclick="_webPickerCancel()">取消</button>
      </div>
    </div>
  </div>

  <script>
  /**
   * Web 版主页逻辑 - 基于 localStorage 的项目管理
   */
  (function () {
    // 获取固定项目列表
    function getPinnedProjects() {
      try { return JSON.parse(localStorage.getItem('pinned-projects') || '[]'); } catch { return []; }
    }
    function savePinnedProjects(list) {
      localStorage.setItem('pinned-projects', JSON.stringify(list));
    }

    // 固定/取消固定项目
    function togglePinProject(folderPath) {
      let pinned = getPinnedProjects();
      const idx = pinned.findIndex(p => p.path === folderPath);
      if (idx >= 0) {
        pinned.splice(idx, 1);
      } else {
        const recent = JSON.parse(localStorage.getItem('recent-projects') || '[]');
        const proj = recent.find(p => p.path === folderPath);
        if (proj) pinned.unshift({ ...proj });
      }
      savePinnedProjects(pinned);
      renderPinnedProjects();
      renderRecentProjects();
    }

    // 渲染固定项目
    function renderPinnedProjects() {
      const container = document.getElementById('pinned-projects');
      const noPinned = document.getElementById('no-pinned');
      if (!container) return;
      const pinned = getPinnedProjects();
      container.innerHTML = '';
      if (pinned.length === 0) { noPinned?.classList.remove('hidden'); return; }
      noPinned?.classList.add('hidden');
      pinned.forEach(proj => {
        const card = document.createElement('div');
        card.className = 'recent-card pinned-card';
        card.innerHTML =
          '<div class="recent-card-name">📌 ' + (proj.name || i18n.t('app.unnamed')) + '</div>' +
          '<div class="recent-card-time">' + formatTime(proj.lastOpened) + '</div>' +
          '<div style="display:flex;gap:8px;align-items:center;margin-top:6px;">' +
            '<span class="recent-card-mode">' + (proj.mode === 'extension' ? i18n.t('app.extension') : i18n.t('app.normal')) + '</span>' +
            '<button class="pin-btn pinned" title="' + i18n.t('app.unpin') + '">✖</button>' +
          '</div>';
        card.querySelector('.pin-btn').onclick = (e) => { e.stopPropagation(); togglePinProject(proj.path); };
        card.onclick = () => openProject(proj.path);
        container.appendChild(card);
      });
    }

    // 渲染最近项目
    function renderRecentProjects() {
      const container = document.getElementById('recent-projects');
      const noProjects = document.getElementById('no-projects');
      if (!container) return;
      let list = [];
      try { list = JSON.parse(localStorage.getItem('recent-projects') || '[]'); } catch {}
      container.innerHTML = '';
      if (list.length === 0) { noProjects?.classList.remove('hidden'); return; }
      noProjects?.classList.add('hidden');
      const pinned = getPinnedProjects();
      const pinnedPaths = new Set(pinned.map(p => p.path));
      list.forEach(proj => {
        const card = document.createElement('div');
        card.className = 'recent-card';
        const isPinned = pinnedPaths.has(proj.path);
        card.innerHTML =
          '<div class="recent-card-name">' + (proj.name || i18n.t('app.unnamed')) + '</div>' +
          '<div class="recent-card-time">' + formatTime(proj.lastOpened) + '</div>' +
          '<div style="display:flex;gap:8px;align-items:center;margin-top:6px;">' +
            '<span class="recent-card-mode">' + (proj.mode === 'extension' ? i18n.t('app.extension') : i18n.t('app.normal')) + '</span>' +
            '<button class="pin-btn' + (isPinned ? ' pinned' : '') + '" title="' + (isPinned ? i18n.t('app.unpin') : i18n.t('app.pin')) + '">' + (isPinned ? '📌' : '📍') + '</button>' +
          '</div>';
        card.querySelector('.pin-btn').onclick = (e) => { e.stopPropagation(); togglePinProject(proj.path); };
        card.onclick = () => openProject(proj.path);
        container.appendChild(card);
      });
    }

    function formatTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return d.toLocaleString(i18n.isEnglish() ? 'en-US' : 'zh-CN');
    }

    // 打开项目（Web 版：导航到 editor.html）
    async function openProject(folder) {
      addRecentProject(folder);
      await window.api.openEditor(folder, 'normal');
    }

    // ============ 打开项目来源选择弹窗 ============

    function showOpenSourceDialog() {
      const dialog = document.getElementById('open-source-dialog');
      dialog.classList.remove('hidden');

      // 初始化云端项目列表
      loadCloudProjects();
    }

    function hideOpenSourceDialog() {
      document.getElementById('open-source-dialog').classList.add('hidden');
    }

    // 从社区 API 获取云端项目列表
    async function loadCloudProjects() {
      const statusEl = document.getElementById('os-cloud-status');
      const listEl = document.getElementById('os-cloud-list');
      if (!statusEl || !listEl) return;

      listEl.innerHTML = '<div style="color:var(--text-muted);padding:8px;">加载中...</div>';

      CommunityAPI.init();
      const res = await CommunityAPI.getProjects(1, 'newest');
      if (res.error || !res.data || res.data.length === 0) {
        listEl.innerHTML = '<div style="color:var(--text-muted);padding:8px;">暂无云端项目</div>';
        statusEl.textContent = '';
        return;
      }

      statusEl.textContent = '共 ' + (res.total || res.data.length) + ' 个公开项目';
      listEl.innerHTML = res.data.map(p => {
        const author = p.profiles || {};
        return '<div class="os-cloud-item" data-zip="' + (p.zip_url || '') + '" data-id="' + p.id + '" data-title="' + (p.title || '') + '">' +
          '<div class="os-cloud-name">' + (p.title || 'Unnamed') + '</div>' +
          '<div class="os-cloud-author">' + (author.username || '匿名') + ' · ❤️ ' + (p.likes_count || 0) + '</div>' +
        '</div>';
      }).join('');

      listEl.querySelectorAll('.os-cloud-item').forEach(item => {
        item.onclick = async () => {
          const zipUrl = item.dataset.zip;
          const title = item.dataset.title || '云端项目';
          if (!zipUrl) {
            alert('该作品没有 ZIP 文件，无法打开');
            return;
          }
          hideOpenSourceDialog();
          await importZipFromUrl(zipUrl, title);
        };
      });
    }

    // 从 ZIP blob 解压并导入到 VFS，返回项目路径
    async function importZipToVFS(zipBlob, projectName) {
      const zip = await JSZip.loadAsync(zipBlob);
      const folder = '/projects/' + projectName.replace(/\s+/g, '_') + '_' + Date.now();

      await window.api.ensureDir(folder);

      // 检测是否有公共根文件夹（如 "project-name/project.json"）
      const allPaths = Object.keys(zip.files).filter(p => !zip.files[p].dir);
      let commonPrefix = '';
      if (allPaths.length > 0) {
        const firstParts = allPaths[0].split('/');
        if (firstParts.length > 1) {
          // 检查是否所有文件都有相同的根文件夹
          const rootFolder = firstParts[0] + '/';
          const allHaveRoot = allPaths.every(p => p.startsWith(rootFolder));
          if (allHaveRoot) commonPrefix = rootFolder;
        }
      }

      // 解压所有文件到 VFS
      const fileEntries = Object.entries(zip.files);
      for (const [relPath, fileEntry] of fileEntries) {
        if (fileEntry.dir) continue;
        // 跳过 macOS 的 __MACOSX 和 .DS_Store
        if (relPath.startsWith('__MACOSX') || relPath.endsWith('.DS_Store')) continue;

        // 去除公共根文件夹前缀
        let cleanPath = commonPrefix && relPath.startsWith(commonPrefix)
          ? relPath.slice(commonPrefix.length)
          : relPath;
        if (!cleanPath) continue;

        if (/\.(png|jpg|jpeg|gif|bmp|webp|svg|mp3|wav|ogg)$/i.test(cleanPath)) {
          // 二进制文件
          const base64 = await fileEntry.async('base64');
          const mimeMatch = cleanPath.match(/\.(png|jpg|jpeg|gif|bmp|webp|svg|mp3|wav|ogg)$/i);
          const mimeMap = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif',
            bmp:'image/bmp', webp:'image/webp', svg:'image/svg+xml',
            mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg' };
          const mime = mimeMap[mimeMatch[1].toLowerCase()] || 'application/octet-stream';
          const content = 'data:' + mime + ';base64,' + base64;
          localStorage.setItem('vfsb:' + folder + '/' + cleanPath, content);
        } else {
          const content = await fileEntry.async('string');
          await window.api.writeFile(folder + '/' + cleanPath, content);
        }
      }

      // 确保 project.json 存在
      const hasConfig = await window.api.readFile(folder + '/project.json');
      if (!hasConfig) {
        // 从 ZIP 内容推断模式
        let mode = 'normal';
        const extCheck = commonPrefix ? commonPrefix + 'extensions/' : 'extensions/';
        if (zip.files[extCheck] || Object.keys(zip.files).some(k => k.startsWith(extCheck))) mode = 'extension';
        const config = {
          name: projectName,
          version: '1.0',
          mode: mode,
          created: new Date().toISOString(),
          stageWidth: 480,
          stageHeight: 360,
        };
        await window.api.writeFile(folder + '/project.json', JSON.stringify(config, null, 2));
      }

      // 确保 scripts/main.json 存在
      const hasScripts = await window.api.readFile(folder + '/scripts/main.json');
      if (!hasScripts) {
        await window.api.ensureDir(folder + '/scripts');
        await window.api.writeFile(folder + '/scripts/main.json', '{}');
      }

      return folder;
    }

    // 从本地 ZIP 文件导入
    async function importZipFromLocalFile(file) {
      if (!file) return;
      const projectName = file.name.replace(/\.zip$/i, '');
      try {
        const folder = await importZipToVFS(file, projectName);
        addRecentProject(folder);
        await window.api.openEditor(folder, 'normal');
      } catch (e) {
        alert('导入失败: ' + e.message);
      }
    }

    // 从本地文件夹导入（使用 webkitdirectory 选择的 FileList）
    async function importFolderToVFS(fileList) {
      if (!fileList || fileList.length === 0) return;

      // 检测公共根文件夹
      const allPaths = [];
      for (const f of fileList) {
        allPaths.push(f.webkitRelativePath || f.name);
      }
      let commonPrefix = '';
      if (allPaths.length > 0) {
        const firstParts = allPaths[0].split('/');
        if (firstParts.length > 1) {
          const rootFolder = firstParts[0] + '/';
          if (allPaths.every(p => p.startsWith(rootFolder))) commonPrefix = rootFolder;
        }
      }

      const projectName = commonPrefix ? commonPrefix.replace(/\/$/, '') : (fileList[0].webkitRelativePath || fileList[0].name).split('/')[0];
      const folder = '/projects/' + projectName.replace(/\s+/g, '_') + '_' + Date.now();
      await window.api.ensureDir(folder);

      for (const f of fileList) {
        const relPath = f.webkitRelativePath || f.name;
        // 跳过 macOS 元数据
        if (relPath.includes('__MACOSX') || relPath.endsWith('.DS_Store')) continue;
        // 去除公共根前缀
        let cleanPath = commonPrefix && relPath.startsWith(commonPrefix)
          ? relPath.slice(commonPrefix.length)
          : relPath;
        if (!cleanPath) continue;

        if (/\.(png|jpg|jpeg|gif|bmp|webp|svg|mp3|wav|ogg)$/i.test(cleanPath)) {
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(f);
          });
          localStorage.setItem('vfsb:' + folder + '/' + cleanPath, dataUrl);
        } else {
          const text = await f.text();
          await window.api.writeFile(folder + '/' + cleanPath, text);
        }
      }

      // 确保 project.json 存在
      const hasConfig = await window.api.readFile(folder + '/project.json');
      if (!hasConfig) {
        let mode = 'normal';
        const allClean = allPaths.map(p => commonPrefix && p.startsWith(commonPrefix) ? p.slice(commonPrefix.length) : p);
        if (allClean.some(p => p.startsWith('extensions/'))) mode = 'extension';
        const config = {
          name: projectName,
          version: '1.0',
          mode: mode,
          created: new Date().toISOString(),
          stageWidth: 480,
          stageHeight: 360,
        };
        await window.api.writeFile(folder + '/project.json', JSON.stringify(config, null, 2));
      }

      // 确保 scripts/main.json 存在
      const hasScripts = await window.api.readFile(folder + '/scripts/main.json');
      if (!hasScripts) {
        await window.api.ensureDir(folder + '/scripts');
        await window.api.writeFile(folder + '/scripts/main.json', '{}');
      }

      return folder;
    }

    // 从 URL 下载 ZIP 并导入
    async function importZipFromUrl(url, projectName) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const blob = await response.blob();
        const folder = await importZipToVFS(blob, projectName || 'url_project');
        addRecentProject(folder);
        await window.api.openEditor(folder, 'normal');
      } catch (e) {
        alert('下载或导入失败: ' + e.message);
      }
    }

    // 添加最近项目
    function addRecentProject(folder) {
      let list = [];
      try { list = JSON.parse(localStorage.getItem('recent-projects') || '[]'); } catch {}
      const name = folder.split(/[\\/]/).pop();
      // 读取项目配置
      const configStr = localStorage.getItem('vfs:' + folder + '/project.json');
      let mode = 'normal';
      let projName = name;
      if (configStr) {
        try {
          const config = JSON.parse(configStr);
          projName = config.name || name;
          mode = config.mode || 'normal';
        } catch {}
      }
      list = list.filter(p => p.path !== folder);
      list.unshift({ name: projName, path: folder, mode: mode, lastOpened: new Date().toISOString() });
      if (list.length > 10) list = list.slice(0, 10);
      localStorage.setItem('recent-projects', JSON.stringify(list));
      renderRecentProjects();
    }

    // 显示模式弹窗
    function showModeDialog() {
      document.getElementById('mode-dialog').classList.remove('hidden');
    }
    function hideModeDialog() {
      document.getElementById('mode-dialog').classList.add('hidden');
    }

    // 新建项目（Web 版：直接在 VFS 中创建，无需选择文件夹）
    async function createNewProject(mode) {
      hideModeDialog();
      mode = mode || 'normal';
      const projectName = i18n.t('app.myWork');
      const folder = '/projects/' + projectName + '_' + Date.now();

      await window.api.ensureDir(folder);
      await window.api.ensureDir(folder + '/scripts');
      await window.api.ensureDir(folder + '/assets');
      await window.api.ensureDir(folder + '/sounds');
      if (mode === 'extension') {
        await window.api.ensureDir(folder + '/extensions');
      }

      const config = {
        name: projectName,
        version: '1.0',
        mode: mode,
        created: new Date().toISOString(),
        stageWidth: 480,
        stageHeight: 360,
      };
      await window.api.writeFile(folder + '/project.json', JSON.stringify(config, null, 2));
      await window.api.writeFile(folder + '/scripts/main.json', '{}');

      // 导航到编辑器
      await window.api.openEditor(folder, mode);

      // 添加到最近项目
      addRecentProject(folder);
    }

    document.addEventListener('DOMContentLoaded', () => {
      i18n.applyToDOM();

      // 语言切换
      document.getElementById('home-lang-switch')?.addEventListener('click', () => {
        i18n.setLocale(i18n.isEnglish() ? 'zh-CN' : 'en');
      });

      // 新建项目
      document.getElementById('home-btn-new').addEventListener('click', showModeDialog);

      // 打开项目（通过来源选择弹窗）
      document.getElementById('home-btn-open').addEventListener('click', showOpenSourceDialog);

      // 来源弹窗标签切换
      document.querySelectorAll('#os-tabs .os-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#os-tabs .os-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const src = tab.dataset.source;
          document.getElementById('os-cloud-panel').style.display = src === 'cloud' ? '' : 'none';
          document.getElementById('os-local-panel').style.display = src === 'local' ? '' : 'none';
          document.getElementById('os-url-panel').style.display = src === 'url' ? '' : 'none';
        });
      });
      document.getElementById('os-cancel').addEventListener('click', hideOpenSourceDialog);

      // 本地 ZIP 打开
      document.getElementById('os-local-btn').addEventListener('click', () => {
        const fileInput = document.getElementById('os-local-file');
        if (fileInput.files && fileInput.files[0]) {
          hideOpenSourceDialog();
          importZipFromLocalFile(fileInput.files[0]);
        }
      });

      // 本地文件夹打开
      document.getElementById('os-local-folder-btn').addEventListener('click', async () => {
        const folderInput = document.getElementById('os-local-folder');
        if (!folderInput.files || folderInput.files.length === 0) {
          alert('请先选择一个文件夹');
          return;
        }
        hideOpenSourceDialog();
        try {
          const folder = await importFolderToVFS(folderInput.files);
          addRecentProject(folder);
          await window.api.openEditor(folder, 'normal');
        } catch (e) {
          alert('导入文件夹失败: ' + e.message);
        }
      });

      // URL 打开
      document.getElementById('os-url-btn').addEventListener('click', () => {
        const url = document.getElementById('os-url-input').value.trim();
        if (!url) { alert('请输入网址'); return; }
        if (!/\.zip($|\?|#)/i.test(url)) {
          alert('网址必须以 .zip 结尾');
          return;
        }
        hideOpenSourceDialog();
        importZipFromUrl(url, url.split('/').pop().replace(/\.zip$/i, '').split('?')[0] || 'url_project');
      });

      // 模式选择
      document.querySelectorAll('.mode-card').forEach(card => {
        card.addEventListener('click', () => createNewProject(card.dataset.mode));
      });
      document.getElementById('mode-cancel').addEventListener('click', hideModeDialog);

      // 渲染项目列表
      renderPinnedProjects();
      renderRecentProjects();

      // 检查 URL 参数是否指定创建模式
      const urlMode = new URLSearchParams(window.location.search).get('mode');
      if (urlMode === 'extension' || urlMode === 'normal') {
        createNewProject(urlMode);
      }
    });
  })();
  </script>
</body>
</html>
